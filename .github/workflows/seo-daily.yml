name: SEO daily (search data + IndexNow)

on:
  schedule:
    - cron: "17 15 * * *" # 08:17 Pacific (PDT), after the daily funniest page
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Submit every sitemap URL to IndexNow (first run / backfill)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # keyless Google sign-in (Workload Identity Federation)

env:
  # Not secrets. Leave GCP_WIF_PROVIDER empty to skip Google.
  GCP_WIF_PROVIDER: projects/352805808321/locations/global/workloadIdentityPools/shutap-github/providers/github-actions
  GCP_SERVICE_ACCOUNT: shutap-seo-bot@project-1e0ec933-91ac-4b2c-8cc.iam.gserviceaccount.com

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Google sign-in (keyless)
        id: gauth
        if: env.GCP_WIF_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false

      - name: Pull Search Console + Bing data
        env:
          GSC_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/seo/search-data-pull.mjs

      - name: Ping IndexNow (Bing, Yandex, etc.)
        env:
          INDEXNOW_ALL: ${{ inputs.submit_all && '1' || '0' }}
        run: node scripts/seo/indexnow.mjs

      - name: Commit search data
        run: |
          git config user.name "shutap-seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add seo-data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "seo-data: daily search pull [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
