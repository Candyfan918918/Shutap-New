name: Prod smoke (write a bit)

# Writes one real bit on shutap.com as the smoke account after every merge
# to main (give Lovable a few minutes to publish first) and every morning.
# Fails if the box, the write or the result is broken. See scripts/smoke/.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *" # 06:17 Pacific
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.SUPABASE_URL != '' && secrets.SMOKE_EMAIL != '' }}
    steps:
      # Until the four repo secrets are added the job skips instead of failing
      # (Nov 5 2026: it failed and emailed on every push since it was added).
      - name: Secrets present?
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Smoke skipped - add SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_PUBLISHABLE_KEY and SMOKE_EMAIL under Settings > Secrets and variables > Actions."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
      - name: Wait for the publish
        if: env.HAS_SECRETS == 'true' && github.event_name == 'push'
        run: sleep 300
      - if: env.HAS_SECRETS == 'true'
        run: npm i --no-save playwright @supabase/supabase-js && npx playwright install --with-deps chromium
      - if: env.HAS_SECRETS == 'true'
        run: node scripts/smoke/write-bit.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore
