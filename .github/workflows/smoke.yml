name: Prod smoke (write a bit)

# Writes one real bit on shutap.com as the smoke account after every merge
# to main (give Lovable a few minutes to publish first) and every morning.
# Fails if the box, the write or the result is broken. See scripts/smoke/.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *" # 06:17 Pacific
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The full browser test signs in with the service role key, which Lovable
      # Cloud does not give out. Without it, the job runs the live health
      # check instead: one real bit through the writer, judge, scrubber and guard.
      HAS_SECRETS: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.SUPABASE_URL != '' && secrets.SMOKE_EMAIL != '' }}
    steps:
      - name: Wait for the publish (health check)
        if: env.HAS_SECRETS != 'true' && github.event_name == 'push'
        run: sleep 300
      - name: Live health check (write one bit)
        if: env.HAS_SECRETS != 'true'
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 90 'https://shutap.com/api/public/bit-health?fresh=1' || echo 000)
            echo "attempt $i: HTTP $code"; head -c 400 body.json 2>/dev/null; echo
            [ "$code" = "200" ] && grep -q '"ok":true' body.json && exit 0
            sleep 30
          done
          echo "::error::The live health check could not write a bit"; exit 1
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
      - name: Wait for the publish
        if: env.HAS_SECRETS == 'true' && github.event_name == 'push'
        run: sleep 300
      - if: env.HAS_SECRETS == 'true'
        run: npm i --no-save playwright @supabase/supabase-js && npx playwright install --with-deps chromium
      - if: env.HAS_SECRETS == 'true'
        run: node scripts/smoke/write-bit.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore
